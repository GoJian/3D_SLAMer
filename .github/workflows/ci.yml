name: ci

on:
  push:
  pull_request:

jobs:
  config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - run: python scripts/validate_config.py

  ros-build:
    # Builds project packages plus the pinned px4_msgs (no other third-party, no ZED SDK, no CUDA,
    # no PX4/Gazebo: the SITL flight test runs on the Jetson, scripts/setup_px4_sitl.sh).
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: px4_msgs (pinned in dependencies.repos)
        shell: bash
        run: |
          apt-get update && apt-get install -y git python3-yaml
          url=$(python3 -c "import yaml; print(yaml.safe_load(open('dependencies.repos'))['repositories']['px4_msgs']['url'])")
          ver=$(python3 -c "import yaml; print(yaml.safe_load(open('dependencies.repos'))['repositories']['px4_msgs']['version'])")
          git clone -q "$url" src/third_party/px4_msgs
          git -C src/third_party/px4_msgs checkout -q "$ver"
      - name: rosdep
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
          colcon test
          colcon test-result --verbose
