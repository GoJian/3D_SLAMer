[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x650-reconstruction"
version = "0.0.0"
description = "Post-flight camera/trajectory refinement, dense geometry, meshing and texturing orchestration (COLMAP + OpenMVS candidate)."
requires-python = ">=3.10"
dependencies = []  # pin during M0 / M5

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
