[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x650-model-export"
version = "0.0.0"
description = "Texture/geometry packaging, coordinate metadata, validation and display LODs."
requires-python = ">=3.10"
dependencies = []  # pin during M0 / M5

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
